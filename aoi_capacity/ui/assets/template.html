<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AOI 가동 현황</title>
<style>
/* ── 시각 테마의 단일 출처. 아래 첫 블록(dark)과 data-theme="light" 블록의 토큰은 PyQt6 수집 창(ui/theme.py)이 그대로 읽는다.
   결과 화면은 라이트 단일(D48-⑥) — html 요소의 data-theme 을 light 로 고정한다. dark 블록은 수집 창의 다크 모드 값이다. ── */
:root{
  color-scheme:dark;
  --bg:#0F1319; --surface:#141920; --surface-2:#1A2130; --raise:#1E2838;
  --ink:#E4EEF8; --ink-2:#8AAEC8; --ink-3:#7C90A6; --line:#1E3050; --line-2:#2A4060;
  --accent:#4A9EE8; --accent-2:#7EC8F0; --accent-ink:#0F1319; --accent-soft:#0D2A44;
  --run:#4A9EE8; --err:#E85A5A; --off:#243040; --nodata:#182030; --prev:#3A4A60;
  --good:#3DCC8E; --good-soft:#0F2E24; --warn:#E0A82E; --warn-soft:#332608; --crit:#E85A5A; --crit-ink:#F08080; --crit-soft:#3A1818;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#F7F9FB; --raise:#EAF0F7;
  --ink:#0F151C; --ink-2:#4B5866; --ink-3:#5A6673; --line:#E1E6EC; --line-2:#DCE2E9;
  --accent:#2E6BA8; --accent-2:#8FB8DE; --accent-ink:#FFFFFF; --accent-soft:#EAF0F7;
  --run:#2E6BA8; --err:#C5453C; --off:#E9EDF2; --nodata:#F0F3F7; --prev:#C9D1DA;
  --good:#276B48; --good-soft:#E7F0EA; --warn:#B0862F; --warn-soft:#FBEFD6; --crit:#C5453C; --crit-ink:#9C3527; --crit-soft:#FAE7E4;
  /* 화면 전용 — 막대 6단계(D48-⑦ 용어: Scan · Rescan · Test · Error · 에러 후 대기 · 대기) */
  --dup:#8FB8DE; --test:#B49BD6; --test-ink:#7A5BA8; --stop:#F1D3CE; --idle:#E9EDF2; --future:#F7F9FB;
  --nav-on:#1D4E82; --sans:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:Consolas,'Cascadia Mono',ui-monospace,monospace; --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:#2B5F97;text-decoration:none}a:hover{color:#1C4470;text-decoration:underline}
::selection{background:#D6E4F5}
h1,h2,h3{margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 전환(impeccable animate 플레이북 · 9/20): 상태 변화는 150~300ms, 레이아웃·오버레이는 300~500ms, 감속은 cubic-bezier(.16,1,.3,1). 노드는 morph 로 유지되므로 CSS transition 이 실제로 이어진다. */
.hbar i{transition:width .38s var(--ease)}
.chart .f{transition:height .38s var(--ease),background-color .25s}
.seg button,.nav button,.btn,.callout,.rowbtn,.link{transition:background-color .16s,color .16s,border-color .16s}
.stage{position:relative}
[data-leaving]{pointer-events:none}
/* 팝업 겹침: 맨 위 팝업만 살아 있고, 그 아래 팝업은 옆으로 물러나 어두워진다(앱 전환 화면처럼 — 뒤에 무엇이 열려 있는지 보인다) */
.dlg{transition:transform .42s var(--ease),filter .42s var(--ease),opacity .3s;transform-origin:left center}
.ov.behind{background:transparent;backdrop-filter:none;pointer-events:none;overflow:hidden}
.ov.behind .dlg{transform:perspective(1400px) translate3d(calc(var(--d,1)*-64px),calc(var(--d,1)*-30px),0) rotateY(calc(var(--d,1)*9deg)) scale(calc(1 - var(--d,1)*.06));transform-origin:left top;filter:brightness(.62) saturate(.8);box-shadow:0 30px 80px rgba(15,21,28,.4)}
.ov.behind .dlg::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(15,21,28,.12);pointer-events:none}
.thead button.th{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;justify-content:flex-end;width:100%;color:var(--ink-3);font-weight:600;font-size:11.5px;white-space:nowrap}
.thead button.th:hover,.thead button.th.on{color:var(--ink)}
.thead button.th.l{justify-content:flex-start}
.thead button.th svg{width:9px;height:9px;flex:none;opacity:.55}
.thead button.th.on svg{opacity:1}
.grp{display:flex;align-items:baseline;gap:10px;padding:10px 18px 6px;background:#F7F9FB;border-top:1px solid #EDF1F5;font-size:13px;font-weight:700}
.grp small{font-weight:400;color:var(--ink-3);font-size:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--accent-soft);color:var(--nav-on);font-size:12px;font-weight:600;cursor:pointer;max-width:320px}
.fchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:7px;cursor:pointer;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;flex:none}
.fbtn:hover{border-color:var(--line-2);color:var(--ink)}
.fbtn.on{background:var(--accent-soft);color:var(--nav-on);border-color:transparent}
.fbtn svg{width:13px;height:13px}
.row2{display:grid;grid-template-columns:1fr 38px;align-items:center;border-top:1px solid #F1F4F7}
.row2>.rowbtn{border:0}
.partial{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--warn-soft,#F6ECD6);color:var(--warn);font-size:11px;font-weight:600;vertical-align:1px}

/* ── 머리 ── */
.hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:0 24px;min-height:58px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.brand i{width:9px;height:18px;border-radius:2px;background:var(--accent);display:block}
.nav{display:flex;gap:2px}
.nav button{padding:6px 13px;border:0;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600;background:transparent;color:var(--ink-3)}
.nav button.on{background:var(--accent-soft);color:var(--nav-on)}
.daynav{display:flex;align-items:center;gap:8px}
.ib{width:30px;height:30px;border:1px solid var(--line-2);background:#fff;border-radius:7px;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1}
.ib:disabled{opacity:.35;cursor:not-allowed}
.daylab{font-weight:600;font-size:14px;min-width:132px;text-align:center}
.btn{padding:6px 11px;border:1px solid var(--line-2);background:#fff;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--accent-2)}
.stamp{font-size:12px;color:var(--ink-3);white-space:nowrap;font-family:var(--mono)}
.stamp.unfixed{color:var(--warn)}
main{max-width:1420px;margin:0 auto;padding:22px 24px 90px}
.spacer{flex:1}

/* ── 공용 ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.cards>div{padding:14px 18px;box-shadow:inset 1px 0 0 #EDF1F5;min-width:0}
.cards .k{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.cards .v{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards .v small{font-size:17px;color:var(--ink-3);font-weight:400}
.cards .s{margin:1px 0 0;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards.sm .v{font-size:22px;letter-spacing:-.02em}
.cards.xs .v{font-size:20px;letter-spacing:-.02em}
.cards.xs>div{padding:12px 15px}
.bar-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.bar-h h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;border-left:1px solid var(--line-2);padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;background:#fff;color:var(--ink-3)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--nav-on)}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.panel.pad{padding:16px 20px 12px;margin-bottom:16px}
.panel h2{font-size:14.5px;font-weight:700}
.legend{display:flex;gap:7px 18px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid #EDF1F5;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.rowbtn{width:100%;display:grid;align-items:center;border:0;border-bottom:1px solid #F1F4F7;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left}
.rowbtn:hover{background:#F7F9FB}
.thead{display:grid;align-items:center;padding:9px 18px 7px;border-bottom:1px solid #EDF1F5;background:#FBFCFD;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.ticks{position:relative;display:block;height:14px}
.ticks span{position:absolute;top:0;white-space:nowrap;font-size:10.5px;color:var(--ink-3)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.err{background:var(--crit-soft);color:var(--crit-ink)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.mono{font-family:var(--mono);font-size:11px;padding:1px 7px}
.st{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;margin-left:6px;vertical-align:1px}
.st.bad{background:var(--crit-soft);color:var(--crit-ink)}
.st.warn{background:var(--warn-soft);color:#7A5200}
.chart{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line-2)}
.chart button,.chart>span.b{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;border:0;background:none;padding:0;cursor:pointer}
.chart .v{display:block;font-size:10.5px;color:var(--ink-2);text-align:center;margin-bottom:3px}
.chart .f{display:block;border-radius:3px 3px 0 0;min-height:2px}
.xl{display:flex;gap:3px;margin-top:5px;justify-content:center}
.xl span{flex:1 1 0;min-width:0;text-align:center;font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:visible}
.hbar{display:block;height:9px;border-radius:5px;background:var(--nodata);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:5px;background:var(--err)}
.foot{max-width:1420px;margin:0 auto;padding:0 24px 40px;font-size:12px;color:var(--ink-3);line-height:1.7}
.foot b{color:var(--ink-2);font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#0F151C;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 팝업 ── */
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:34px 20px;background:rgba(15,21,28,.42);backdrop-filter:blur(2px);animation:fadeIn .12s ease-out;overflow:auto}
.ov.z55{z-index:55;padding-top:44px}.ov.z50{z-index:50}.ov.z60{z-index:60}
.ov .scrim{position:fixed;inset:0;border:0;background:none;cursor:default;padding:0}
.dlg{position:relative;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(15,21,28,.28);animation:popIn .16s var(--ease)}
.dlg.w960{width:min(960px,100%);overflow:hidden}.dlg.w1120{width:min(1120px,100%)}.dlg.w1000{width:min(1000px,100%);overflow:hidden}
.dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid #EDF1F5}
.dh h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.dh h2.mid{font-size:18px}
.dh .sub{font-size:13px;color:var(--ink-3)}
.dh .note{font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.x{width:32px;height:32px;border:1px solid var(--line-2);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1}
.db{padding:16px 22px 22px}
.db h3{font-size:14px;font-weight:700;margin:0 0 10px}
.db h3.s{font-size:13.5px;margin:0 0 8px}
.hit{position:absolute;top:0;bottom:0;min-width:3px;border:0;border-left:1px solid rgba(255,255,255,.9);border-right:1px solid rgba(15,21,28,.18);padding:0;cursor:pointer}
.callout{position:absolute;display:flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:11.5px;color:#3D4854;cursor:pointer;white-space:nowrap}
.callout:hover{border-color:var(--accent)}
.callout.on{border-color:var(--accent);background:var(--accent-soft);color:var(--nav-on);font-weight:700}
.sel{margin-top:12px;padding:14px 16px;background:#FBFCFD;border:1px solid #E7ECF1;border-radius:11px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:12.5px}
.kv .k{color:var(--ink-3)}
.link{border:0;background:none;font:inherit;font-size:12.5px;color:#2B5F97;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.tline{position:relative;height:26px;border-radius:5px;background:#EEF2F6;overflow:hidden;margin-bottom:6px}
.tline i{position:absolute;top:0;bottom:0;min-width:3px;border-radius:2px;animation:fadeIn .3s ease-out}
.tbl-h{display:grid;gap:10px;padding:8px 14px;background:#FBFCFD;border-bottom:1px solid #EDF1F5;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.box{border:1px solid #E7ECF1;border-radius:11px;overflow:hidden}
.members{margin-top:8px;padding:10px 12px;background:#F7F9FB;border:1px solid #E7ECF1;border-radius:10px}
.empty{padding:12px 14px;font-size:12.5px;color:var(--ink-3)}
@media (max-width:820px){main{padding:16px 12px 70px}.hdr{padding:0 12px}.daylab{min-width:0}}
</style>
</head>

<script>
"use strict";
/* ============================================================================
   AOI 가동 현황 — 수집기가 만든 정적 HTML 한 장. 바깥으로 요청을 한 건도 보내지 않는다.
   ① 로더: `#embedded` JSON(collect._embed_rows — cols/pooled/pool/rows/meta)을 열 이름으로 편다.
   ② 분류 규칙: collect._CAUSE_RULES / _OUTCOME_RULES 와 정규식 글자까지 같다(가드 test_template_contract).
   ③ 모델 buildModel(): 프로필이 둘이다(RULES.profile). product(기본, buildModelV3 — D56~D58·D63·D64·D04·D09)가 제품 규칙이고,
      legacy(buildModelLegacy)는 디자인 세션의 make_aoi_data.js [원본] 이식이라 네 스위치를 끄면 그 스크립트와 같은 출력이 나온다(가드 test_dashboard_js).
   ④ 화면: 가동률 · Error · 추이 · 리포트 + 장비/Error/유형·Job 팝업 (docs/design/dashboard-redesign/app/AOI-Dashboard.dc.html 의 로직).
   ============================================================================ */
const MODEL_VERSION=3;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60),x=m%60;return h?(x?h+"시간 "+x+"분":h+"시간"):x+"분";};
const clock=m=>p2(Math.floor(m/60))+":"+p2(m%60);
const md=s=>s.slice(5).replace("-","/");
const cut=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
const dayName=s=>{const x=new Date(s+"T00:00:00");return (x.getMonth()+1)+"월 "+x.getDate()+"일 ("+"일월화수목금토"[x.getDay()]+")";};
/* 홈 정렬 = devices.sort_key: AOI-1…AOI-25 뒤에 4F-AOI-01… (사전식이면 4F 가 앞으로 온다) */
function devSortKey(n){const s=String(n||"");const m=/(?:^|[^0-9A-Za-z])(4F)[-_ ]*AOI[-_ ]*0*(\d+)$/i.exec(s)||/^(4F)[-_ ]*AOI[-_ ]*0*(\d+)$/i.exec(s);
  if(m)return[1,+m[2],s];const k=/AOI[-_ ]*0*(\d+)\s*$/i.exec(s);return k?[0,+k[1],s]:[2,0,s];}
function cmpDev(a,b){const x=devSortKey(a),y=devSortKey(b);return x[0]-y[0]||x[1]-y[1]||(x[2]<y[2]?-1:x[2]>y[2]?1:0);}
window._log=[];function log(m){window._log.push(`[${new Date().toLocaleTimeString("ko-KR",{hour12:false})}] ${m}`);}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200);}

/* ---------- ② 분류 규칙 (파이썬과 동일 — 순서가 곧 의미) ---------- */
const CAUSE_RULES=[
  ["WAFER_LOST",/wafer\s+lost|failed\s+to\s+sense\s+wafer|failed\s+to\s+move\s+wafer|could\s+not\s+be\s+detected\s+on\s+hand|wafer\s+handling\s+failure|failed\s+on\s+movetostation/i],
  ["HW_ERROR",/hardware\s+failure/i],
  ["ID_READ_ERROR",/failed\s+to\s+read\s+wafer\s+id/i],
  ["ID_FORMAT_ERROR",/wafer\s+id\s+mask\s+length|wafer\s+id\s+read\s+does\s+not\s+match/i],
  ["SCAN_ERROR",/scan\s*(?:2d|3d)?\s*error/i],
  ["ALIGN_ERROR",/alignment\s+error|alignment\s+failed|prealigner\s+fail/i],
  ["PREALIGNER_RESPONSE_ERROR",/prealigner:\s*expected\s+status\s+field\s+was\s+not\s+found/i],
  ["AUTO_FOCUS_ERROR",/auto\s+focus\s+error/i],
  ["FOCUS_MAPPING_ERROR",/focus\s+mapping\s+error/i],
  ["MOTION_ERROR",/motor->get_position|motion\s+failed\s+to\s+get_continuousscanstatus|acsmotor::get_position/i],
  ["CLEAN_REF_ERROR",/clean\s+reference\s+error/i],
  ["NOTHING_TO_SCAN",/nothing\s+to\s+scan/i],
  ["RECIPE_ERROR",/far\s*model|illegal\s+lot\s+name|wafer\s+map\s+import\s+failed|multi\s*recipe\s+error/i],
  ["CONTROL_TIMEOUT",/abort\s+timed-?out/i],
  ["GRAY_LEVEL_LIMIT",/gray\s+level\s+average\s+exceeds/i],
  ["HANDLING_ERROR",/robot\s+operation\s+failed|movetabletostoredposandlock|wafer\s+move\s+failure/i]];
const OUTCOME_RULES=[

  ols(pts){const n=pts.length;if(n<3)return null;let mx=0,my=0;for(const [x,y] of pts){mx+=x;my+=y;}mx/=n;my/=n;

/* ── DOM 갱신: innerHTML 통째 교체 대신 키 있는 morph — 바뀐 노드만 손댄다(9/20, 깜박임·스크롤 튐·포커스 상실의 근원 제거).
   전환은 세 가지뿐이다(impeccable animate 플레이북 — 상태 150~300ms · 레이아웃/오버레이 300~500ms · cubic-bezier(.16,1,.3,1), 나가는 것은 들어오는 것보다 빠르게):
   ① 뷰(탭)가 바뀌면 옛 <main> 은 제자리에서 사라지고 새 <main> 이 올라오며 나타난다 ② data-anim 컨테이너의 키 있는 자식은 FLIP —
   자리 이동은 transform 으로 미끄러지고, 새 자식은 나타나고, 빠진 자식은 제자리에서 사라진 뒤 제거된다(AutoAnimate 와 같은 기법: 앞뒤 rect 차이를 WAAPI 로) ③ 팝업은 나타나고 사라진다(CSS popIn · WAAPI 로 퇴장).
   prefers-reduced-motion 이면 이동 없이 opacity 만 짧게. */
const EASE="cubic-bezier(.16,1,.3,1)";

const canAnim=()=>typeof Element!=="undefined"&&!!(Element.prototype&&Element.prototype.animate);
const keyOf=n=>n&&n.nodeType===1?n.getAttribute("data-key"):null;

function morph(from,to){

  for(const a of [...from.attributes])if(!to.hasAttribute(a.name))from.removeAttribute(a.name);
  for(const a of [...to.attributes])if(from.getAttribute(a.name)!==a.value)from.setAttribute(a.name,a.value);

function morphChildren(from,to){

function flipBefore(p){const m=new Map();for(const c of p.children){if(!keyOf(c)||leaving(c))continue;const r=c.getBoundingClientRect();m.set(c,{top:r.top,left:r.left,w:r.width,h:r.height});}return m;}

  const done=()=>{if(o.parentNode)o.parentNode.removeChild(o);};a.onfinish=done;setTimeout(done,400);}

/* ---------- Error 상세 팝업 (승인 시안 A) ---------- */

  const days=state.errDays&&state.errDays.length>1?state.errDays.filter(d=>D.days.includes(d)):[eDay];const multi=days.length>1;
  const fj=state.errJob,ft=state.errType,filtered=fj!=null||!!ft;
  const la=L=>L[3]>L[2]?L[2]:(L[11]||0),lb=L=>L[3]>L[2]?L[3]:Math.max(L[12]||0,(L[11]||0)+1);
  const perDay=days.map(dy=>({dy,t:S.at(dy,eDev)||{lots:[],ct:{},seg:[],e:0}}));
  const t=perDay[perDay.length-1].t;                                   /* 하루 모드의 그날(타임라인) */

  const lots=[].concat(...perDay.map(x=>lotsOf(x.t)));
  const eLotsD=perDay.map(x=>({dy:x.dy,L:lotsOf(x.t).filter(L=>L[5]&&(!ft||L[9][ft]))}));

  else{for(const L of eLots)for(const [c,v] of Object.entries(L[9])){if(ft&&c!==ft)continue;const g=ctObj[c]||(ctObj[c]=[0,0]);g[0]+=v[0];g[1]+=v[1];}}
  const ct=Object.entries(ctObj).sort((a,b)=>b[1][1]-a[1][1]||b[1][0]-a[1][0]);
  const totN=ct.reduce((a,b)=>a+b[1][0],0),totM=ct.reduce((a,b)=>a+b[1][1],0),cmax=Math.max(1,...ct.map(c=>c[1][1]));
  const segs=(t.seg||[]).map(x=>({a:x[0],b:x[1],k:x[2]})),marks=[];
  const eLast=eLotsD[eLotsD.length-1].L;
  for(const g of segs){if(g.k!==1&&g.k!==3)continue;
    if(filtered&&g.k===1&&!eLast.some(L=>g.b>la(L)&&g.a<lb(L)))continue;
    if(g.k===1)marks.push({l:(g.a/14.4).toFixed(2),w:Math.max(0.25,(g.b-g.a)/14.4).toFixed(2),c:ERR,title:clock(g.a)+"–"+clock(g.b)+" Error "+hm(g.b-g.a)});
    else marks.push({l:(g.a/14.4).toFixed(2),w:Math.max(0.25,(g.b-g.a)/14.4).toFixed(2),c:STOP,title:clock(g.a)+"–"+clock(g.b)+" Error 후 대기 "+hm(g.b-g.a)});}
  const untimed=eLots.filter(L=>!(L[3]>L[2])).length;
  const evts=[];
  for(const {dy,L:Ls} of eLotsD)for(const L of Ls)for(const [c,v] of Object.entries(L[9])){if(ft&&c!==ft)continue;const key=lotKey(L),a=la(L),di=D.days.indexOf(dy);
    evts.push({at:a,dy,time:clock(a),lot:P.lot[L[1]]||"(Lot 확인 불가)",type:c,status:causeText(eDev,P.rep[L[8]]||"",c)||(L[10]>=0?P.st[L[10]]:"(원문 없음)"),min:hm(v[1]),m:v[1],rep:P.rep[L[8]]||"",
      go:()=>setState({modalDev:eDev,modalDayI:di,selLot:key,lotFilter:"all",stack:pushTop("dev")})});}
  evts.sort((a,b)=>b.m-a.m||a.dy.localeCompare(b.dy)||a.at-b.at);
  const end=Math.min(D.days.length,Math.max(eI+1,21)),start=Math.max(0,end-21),win=D.days.slice(start,end);   /* 선택한 날로 끝나는 21일(앞쪽이 모자라면 처음 21일) */

  const filterTxt=ft?("유형 "+ft):("Job "+(JOB_ALIAS[jraw]||jraw)),filterMono=(ft||(G&&!JOB_ALIAS[jraw]));
  const close=()=>setState(CLOSE.err());
  const stats=[{k:"Error",v:totN+"건",ink:totN?"#B4402F":"#0F151C"},{k:"Error 대기",v:hm(totM),ink:totM?"#B4402F":"#0F151C"},{k:"유형",v:ct.length+"가지",ink:"#0F151C"},{k:"Error 난 Lot",v:eLots.length+" / "+lots.length+"개",ink:"#0F151C"},{k:"가장 많은 유형",v:ct.length?ct[0][0].replace("_ERROR",""):"—",ink:"#0F151C"}];
  const inSpan=new Set(days);
  const trend=win.map((dy,i)=>({label:(i%4===0||i===win.length-1)?md(dy):"",vTxt:tr[i]||"",h:(tr[i]/tmax*100).toFixed(1),color:(multi?inSpan.has(dy):dy===eDay)?ERR:"#E0A9A2",title:md(dy)+" · Error "+tr[i]+"건 · 누르면 이 날로",pick:()=>setState({errDays:null,errDayI:D.days.indexOf(dy)}),maxW:9999}));
  /* 여러 날 모드: 24시간 타임라인 대신 날짜별 막대(누르면 그 하루로) */

  const dmx=Math.max(1,...dayAgg.map(a=>a.m));
  const dayBars=dayAgg.map(a=>({label:md(a.dy),vTxt:a.n?a.n+"건":"",h:(a.m/dmx*100).toFixed(1),color:a.m?ERR:"#EDF1F5",title:md(a.dy)+" · Error "+a.n+"건 · Error 대기 "+hm(a.m)+" · 누르면 이 하루만",pick:()=>setState({errDays:null,errDayI:D.days.indexOf(a.dy)}),maxW:9999}));
  const dayNav=multi

  const cols=multi?"66px 58px 150px 1fr 78px":"58px 150px 1fr 78px";
  return `<div class="ov z60"><button class="scrim" data-h="${h(close)}" aria-label="닫기"></button><div class="dlg w1000" role="dialog" aria-modal="true" aria-labelledby="dlg-err-title" data-dlg="err">

      ${filtered?`<button class="btn" data-h="${h(()=>setState({errJob:null,errType:null}))}" title="필터 해제 — 이 장비의 모든 Error 보기" style="display:inline-flex;align-items:center;gap:6px;max-width:320px;border-radius:999px;background:#F7F9FB;font-size:12px;color:#3D4854;${filterMono?"font-family:"+MONO:""}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(filterTxt)}</span><span style="color:#5A6673">✕</span></button>`:""}

    <div class="db">
      <section class="cards xs" style="margin-bottom:18px">${stats.map(s=>`<div><p class="k">${s.k}</p><p class="v num" style="font-size:19px;color:${s.ink}">${esc(s.v)}</p></div>`).join("")}</section>
      ${multi?`<h3 class="s">날짜별 <span style="font-weight:400;color:#5A6673;font-size:12px">막대를 누르면 그 하루의 타임라인으로</span></h3>${barsHtml(dayBars,84,true)}<div style="height:14px"></div>`
      :`<h3 class="s">언제 났나</h3>
      <div style="position:relative;height:15px;margin-bottom:3px">${ticksHtml()}</div>
      <div class="tline">${marks.map(k=>`<i title="${esc(k.title)}" style="left:${k.l}%;width:${k.w}%;background:${k.c}"></i>`).join("")}</div>
      <p style="margin:0 0 18px;font-size:11.5px;color:#5A6673">${marks.length?("진한 빨강이 Error, 연한 빨강이 그 뒤 대기입니다. Error 대기 = Error 시간 + Report 가 끝난 뒤 다음 활동까지."+(untimed?" 시간을 받지 못한 Error "+untimed+"건(배치 창에 빈 시간이 없음)은 막대에 없습니다.":"")):(totN?"시간을 받은 Error 가 없어 막대를 그리지 않았습니다(배치 창에 빈 시간이 없음).":"Error 없음")}</p>`}
      <h3 class="s">유형별</h3>
      <div data-anim>${ct.map(([c,v])=>`<div data-key="ct:${esc(c)}" style="display:grid;grid-template-columns:190px 1fr 46px 72px;gap:10px;align-items:center;padding:4px 0"><span class="mono" title="${esc(c)}" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c)}</span><span class="hbar" style="height:8px"><i style="width:${Math.round(v[1]/cmax*100)}%"></i></span><span class="num" style="text-align:right;font-size:12.5px">${v[0]}건</span><span class="num" style="text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap">${hm(v[1])}</span></div>`).join("")||`<p style="margin:0;font-size:12.5px;color:#5A6673">${multi?"이 기간":"이 날"} 이 장비의 Error 가 없습니다.</p>`}</div>
      <h3 class="s" style="margin-top:18px">${md(win[0])} ~ ${md(win[win.length-1])} 이 장비의 Error <span style="font-weight:400;color:#5A6673;font-size:12px">${multi?"진한 막대가 보고 있는 기간":"선택한 날까지 "+win.length+"일"} · 막대를 누르면 그 날로</span></h3>
      ${barsHtml(trend,74,true)}
      <h3 class="s" style="margin-top:18px">Lot 별 Error${evts.length?" · "+evts.length+"건":""}</h3>
      <div class="box"><div class="tbl-h" style="grid-template-columns:${cols}">${multi?"<span>날짜</span>":""}<span>시각</span><span>Lot</span><span>유형 · 원문</span><span style="text-align:right">Error 대기</span></div>
        ${evts.map(e=>`<button class="rowbtn" data-h="${h(e.go)}" title="가동률 팝업에서 이 Lot 보기" style="grid-template-columns:${cols};gap:10px;align-items:start;padding:9px 14px">${multi?`<span class="num" style="font-size:12.5px;color:#4B5866">${md(e.dy)}</span>`:""}<span class="num" style="font-size:12.5px;color:#4B5866">${e.time}</span><span class="mono" title="${esc(e.lot)}" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.lot)}</span><span style="display:block;min-width:0"><span class="pill err mono">${esc(e.type)}</span><span class="mono" style="display:block;margin-top:3px;font-size:11.5px;color:#4B5866;word-break:break-all">${esc(e.status)}</span></span><span class="num" style="text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap">${e.min}</span></button>`).join("")||`<p class="empty">기록 없음</p>`}
      </div></div></div></div>`;
}

/* ---------- 추이 ---------- */
function trendHtml(){
  const devs=S.devList(),U=state.unit;
  const floors=S.segGroup([{k:"all",label:"전체"},{k:"2",label:"2층"},{k:"4",label:"4층"}],state.floor,k=>setState({floor:k}));
  const units=S.segGroup([{k:"day",label:"일"},{k:"week",label:"주"},{k:"month",label:"월"}],U,k=>setState({unit:k}));
  const PD=new Set(D.partialDays||[]);const full=D.days.filter(d=>!PD.has(d)),useD=full.length?full:D.days;   /* 수집 창 시작일(부분)은 평균에서 뺀다 */
  let buckets=[];
  if(U==="day")buckets=D.days.map(d=>({label:md(d),v:S.fleetUtil(d,devs),day:d,partial:PD.has(d)}));
  else if(U==="week"){const g={};useD.forEach(d=>{const x=new Date(d+"T00:00:00"),wd=(x.getDay()+6)%7,mon=new Date(x.getTime()-wd*86400000);const k2=mon.getFullYear()+"-"+p2(mon.getMonth()+1)+"-"+p2(mon.getDate());(g[k2]||=[]).push(d);});
    buckets=Object.entries(g).map(([k2,ds])=>({label:md(k2)+" 주",day:null,v:ds.reduce((a,d)=>a+S.fleetUtil(d,devs),0)/ds.length}));}
  else{const g={};useD.forEach(d=>{(g[d.slice(0,7)]||=[]).push(d);});buckets=Object.entries(g).map(([k2,ds])=>({label:(+k2.slice(5))+"월",day:null,v:ds.reduce((a,d)=>a+S.fleetUtil(d,devs),0)/ds.length}));}
  const fullB=buckets.filter(b=>!b.partial),avgB=fullB.length?fullB:buckets;
  const mx=Math.max(...buckets.map(b=>b.v),1)*1.12,avg=avgB.reduce((a,b)=>a+b.v,0)/avgB.length;
  const best=[...buckets].sort((a,b)=>b.v-a.v)[0],low=[...buckets].sort((a,b)=>a.v-b.v)[0];
  const bars=buckets.map((b,i)=>({label:(i%Math.ceil(buckets.length/11)===0||i===buckets.length-1)?b.label:"",vTxt:(buckets.length<=16||b===best||b===low||i===buckets.length-1)?b.v.toFixed(0):"",h:(b.v/mx*100).toFixed(1),cur:b.day?"pointer":"default",
    title:b.day?(md(b.day)+" · 평균 "+b.v.toFixed(1)+"%"+(b.partial?" · 보관 기간 첫날(부분) — 평균에서 제외":"")+" · 누르면 그 날 목록으로"):(b.label+" · 평균 "+b.v.toFixed(1)+"%"),pick:b.day?(()=>{setState({view:"home",dayI:D.days.indexOf(b.day)});window.scrollTo(0,0);}):()=>{},color:b.partial?"#DCE2E9":(b.v<S.thU()?ERR:(b.v<55?DUP:RUN)),maxW:108}));
  const heat=devs.map(n=>{const vals=D.days.map(d=>S.util(S.at(d,n)));const ok=vals.filter(v=>v!==null),a=ok.length?ok.reduce((x,y)=>x+y,0)/ok.length:null;
    return{n,avgTxt:a===null?"—":a.toFixed(0)+"%",avgInk:a!==null&&a<S.thU()?"#B4402F":"#0F151C",cells:vals.map((v,i)=>({bg:v===null?"transparent":HEAT[Math.min(4,Math.floor(Math.min(99.9,v)/20))],ring:v===null?"inset 0 0 0 1px #DCE2E9":"none",title:md(D.days[i])+" · "+n+" · "+(v===null?"시간 기록 없음":v.toFixed(0)+"%")+" · 누르면 팝업",go:S.open(n,i)}))};});
  return `<div class="bar-h"><h1>추이</h1><div class="spacer"></div>${segHtml(floors)}${segHtml(units)}</div>
    <section class="panel pad"><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px"><h2>${U==="day"?"날짜별 평균 가동률":(U==="week"?"주별 평균 가동률":"월별 평균 가동률")}</h2><span style="font-size:12.5px;color:#5A6673;white-space:nowrap">평균 ${avg.toFixed(1)}%${PD.size?" · 첫날(부분) 제외":""}</span></div>
      <div style="position:relative"><span style="position:absolute;left:0;right:0;bottom:${(avg/mx*100).toFixed(1)}%;border-top:1px dashed #B0862F;z-index:1;pointer-events:none;height:0;top:auto"></span>${barsHtml(bars,180,true)}</div></section>
    <div class="bar-h"><h2>장비별 ${D.days.length}일</h2></div>
    <div class="panel" data-anim>
      ${heat.map(hh=>`<div data-key="heat:${esc(hh.n)}" style="display:grid;grid-template-columns:96px 1fr 54px;gap:12px;align-items:center;padding:5px 18px;border-top:1px solid #F1F4F7"><button class="link" style="text-decoration:none;font-size:13px;font-weight:600;color:#0F151C;text-align:left;padding:4px 0" data-h="${h(S.open(hh.n))}">${esc(hh.n)}</button>
        <span style="display:flex;gap:2px">${hh.cells.map(c=>`<button data-h="${h(c.go)}" title="${esc(c.title)}" style="flex:1;height:18px;border:0;border-radius:2px;padding:0;cursor:pointer;background:${c.bg};box-shadow:${c.ring}"></button>`).join("")}</span>
        <span class="num" style="text-align:right;font-size:13px;font-weight:600;color:${hh.avgInk}">${hh.avgTxt}</span></div>`).join("")}
      <div style="display:flex;align-items:center;gap:8px;padding:11px 18px;background:#FBFCFD;font-size:12.5px;color:#4B5866;flex-wrap:wrap"><span>낮음</span><span style="display:flex;gap:2px">${HEAT.map(c=>`<i style="width:22px;height:11px;border-radius:2px;background:${c};display:block"></i>`).join("")}</span><span>높음</span><span style="display:inline-flex;align-items:center;gap:6px;margin-left:16px"><i style="width:22px;height:11px;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px #DCE2E9;display:block"></i>시간 기록 없음</span></div>
    </div>`;
}

/* ---------- 리포트 (TB500 · Kendall, D49) ---------- */
function reportHtml(){
  const P=D.pool,span=state.rptSpan,days=span?D.days.slice(-span):D.days;
  const aliasCache={};
  const aliasOf=gi=>{if(aliasCache[gi]!==undefined)return aliasCache[gi];const G=D.jobGroups[gi];let al=JOB_ALIAS[P.job[G.l]]||null;if(!al)for(const [i] of G.m){if(JOB_ALIAS[P.job[i]]){al=JOB_ALIAS[P.job[i]];break;}}return aliasCache[gi]=al;};
  const blank=()=>({n:0,err:0,errMin:0,fS:0,fN:0,ex:{err:0,small:0,noTime:0},pts:[]});
  const byAlias={};let lotAll=0,lotIn=0;
  for(const dy of days)for(const n of D.devices){const t=S.at(dy,n);if(!t)continue;
    for(const L of t.lots){const gi=D.jobG[L[0]],al=aliasOf(gi);lotAll++;if(!al)continue;lotIn++;
      const A=byAlias[al]||(byAlias[al]={name:al,raw:{},all:blank(),devs:{}});const rawName=P.job[L[0]];A.raw[rawName]=(A.raw[rawName]||0)+1;
      const dv=A.devs[n]||(A.devs[n]=blank());let em=0;for(const v of Object.values(L[9]))em+=v[1];
      for(const Sx of [A.all,dv]){Sx.n++;Sx.err+=L[5];Sx.errMin+=em;Sx.fS+=L[13]||0;Sx.fN+=L[14]||0;}
      /* 제외: 원인 Error 가 있는 Report(L[10]>=0 — 시작일이 아니어도) · 5장 미만 · 배치 시각 없음. 중단은 D52 로 Error 이거나 정상 종료라 따로 없다. */
      const ex=L[10]>=0?"err":(L[4]<5?"small":((L[12]>L[11])?null:"noTime"));
      if(ex){A.all.ex[ex]++;dv.ex[ex]++;continue;}
      A.all.pts.push([L[4],L[12]-L[11]]);dv.pts.push([L[4],L[12]-L[11]]);}}
  const MIN_N=5;
  const fit=Sx=>{const r=Sx.pts.length>=MIN_N?S.ols(Sx.pts):null,mode=S.modeOf(Sx.pts.map(p=>p[0])),bad=r&&r.b<=0;
    return{prep:r&&!bad?r.a.toFixed(1)+" ± "+r.seA.toFixed(1)+"분":"—",per:r&&!bad?r.b.toFixed(2)+" ± "+r.seB.toFixed(2)+"분":"—",conv:r&&!bad&&mode?hm(Math.max(0,r.a+r.b*mode)):"—",
      convSub:r&&!bad&&mode?(mode+"장 기준"):(bad?"기울기 음수 · 신뢰 불가":(Sx.pts.length<MIN_N?"표본 "+Sx.pts.length+"개 (5개 미만)":"장수가 모두 같음")),
      n:Sx.pts.length+" / "+Sx.n,err:Sx.err?Sx.err+"건":"—",eInk:Sx.err?"#B4402F":"#5A6673",wait:Sx.errMin?hm(Sx.errMin):"—",
      fault:Sx.fN?(Sx.fS/Sx.fN).toFixed(1):"—",faultSub:Sx.fN?(Sx.fN+"장"):"faults 열 없음",
      /* 정렬용 원값(없으면 null → 맨 뒤) */
      _n:Sx.pts.length,_a:r&&!bad?r.a:null,_b:r&&!bad?r.b:null,_c:r&&!bad&&mode?Math.max(0,r.a+r.b*mode):null,_e:Sx.err,_w:Sx.errMin,_f:Sx.fN?Sx.fS/Sx.fN:null};};
  const exTxt=Sx=>"제외 — Error "+Sx.ex.err+" · 5장 미만 "+Sx.ex.small+(Sx.ex.noTime?" · 배치 시각 없음 "+Sx.ex.noTime:"");
  const names=Object.keys(byAlias).sort((a,b)=>a<b?-1:a>b?1:0);
  const cols="minmax(210px,1.3fr) 66px 122px 122px 132px 56px 92px 84px";
  /* 정렬(열 머리를 누르면 오름차순 ↔ 내림차순, 기본 이름순) — 그룹(Kendall · TB500) 안에서만 섞인다 */
  const SK=state.rptSort.k,SD=state.rptSort.d;
  const COLS=[["name","Job","",true],["n","배치","표본 / 전체 배치"],["prep","준비","회귀 절편 ± 표준오차"],["per","장당","회귀 기울기 ± 표준오차"],["conv","환산","준비 + 장당 × 최빈 장수"],["err","Error",""],["wait","Error 대기",""],["fault","평균 fault","Report 표 Faults 의 장당 평균 — 값이 있는 행만"]];
  const fits={};for(const al of names)fits[al]=fit(byAlias[al].all);
  const valOf=al=>{const f=fits[al];return{name:al,n:f._n,prep:f._a,per:f._b,conv:f._c,err:f._e,wait:f._w,fault:f._f}[SK];};
  const cmpV=(x,y)=>{const a=valOf(x),b=valOf(y);if(a==null&&b==null)return x<y?-1:1;if(a==null)return 1;if(b==null)return -1;
    const c=typeof a==="string"?(a<b?-1:a>b?1:0):a-b;return c?c*SD:(x<y?-1:x>y?1:0);};
  const th=([k,label,title,left])=>`<button class="th ${left?"l":""} ${SK===k?"on":""}" data-h="${h(()=>setState({rptSort:{k,d:SK===k?-SD:(k==="name"?1:-1)}}))}" title="${esc(title||label)} — 누르면 ${SK===k?(SD>0?"내림차순":"오름차순"):"이 열로 정렬"}" aria-sort="${SK===k?(SD>0?"ascending":"descending"):"none"}">${esc(label)}${SORTICON(SK===k?SD:0)}</button>`;
  const cell=(f,small)=>`<span class="num" style="text-align:right;font-size:${small?12.5:13}px;color:#4B5866;white-space:nowrap">${f.n}</span><span class="num" style="text-align:right;font-size:${small?12.5:13}px;${small?"":"font-weight:600;"}white-space:nowrap">${f.prep}</span><span class="num" style="text-align:right;font-size:${small?12.5:13}px;${small?"":"font-weight:600;"}white-space:nowrap">${f.per}</span>
    <span style="text-align:right;min-width:0"><span class="num" style="display:block;font-size:${small?12.5:13}px;${small?"":"font-weight:600;"}white-space:nowrap">${f.conv}</span><span style="display:block;font-size:11px;color:#5A6673;white-space:nowrap">${esc(f.convSub)}</span></span>
    <span class="num" style="text-align:right;font-size:${small?12.5:13}px;white-space:nowrap;color:${f.eInk}">${f.err}</span><span class="num" style="text-align:right;font-size:${small?12.5:13}px;white-space:nowrap;color:${f.eInk}">${f.wait}</span><span style="text-align:right;min-width:0"><span class="num" style="display:block;font-size:${small?12.5:13}px;white-space:nowrap">${f.fault}</span><span style="display:block;font-size:11px;color:#5A6673;white-space:nowrap">${esc(f.faultSub)}</span></span>`;
  const rowH=al=>{const A=byAlias[al],f=fits[al],open=state.rptOpen===al,raws=Object.entries(A.raw).sort((a,b)=>b[1]-a[1]);
    const devs=Object.keys(A.devs).sort(cmpDev).map(n=>({name:n,title:n+" · "+exTxt(A.devs[n]),...fit(A.devs[n])}));
    return `<div data-key="job:${esc(al)}"><button class="rowbtn" data-h="${h(()=>setState({rptOpen:open?null:al}))}" title="${esc(raws.map(([k,c])=>k+" ("+c+")").join("\n")+"\n"+exTxt(A.all))}" style="grid-template-columns:${cols};gap:10px;padding:10px 18px;border-bottom:0;border-top:1px solid #F1F4F7;min-height:48px;background:${open?"#F7F9FB":"transparent"}">
      <span style="display:block;min-width:0"><span style="display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:#5A6673;font-size:11px;width:10px;display:inline-block;flex:none">${open?"▾":"▸"}</span>${esc(al)}</span><span style="display:block;font-size:11.5px;color:#5A6673;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:17px">표본 ${A.all.pts.length}개 / 배치 ${A.all.n}개 · 장비 ${devs.length}대${raws.length>1?" · 이름 "+raws.length+"개":""}</span></span>${cell(f,false)}</button>
      ${open?`<div style="animation:slideIn .2s var(--ease);background:#FBFCFD">${devs.map(d=>`<div title="${esc(d.title)}" style="display:grid;grid-template-columns:${cols};gap:10px;align-items:center;padding:7px 18px;border-top:1px solid #F1F4F7;font-size:12.5px"><span style="padding-left:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name)}</span>${cell(d,true)}</div>`).join("")}</div>`:""}</div>`;};
  /* 두 묶음: Kendall · TB500(표기명이 Kendall 로 시작하면 Kendall, 나머지는 TB500) */
  const groups=[["Kendall",names.filter(n=>/^Kendall/i.test(n)).sort(cmpV)],["TB500",names.filter(n=>!/^Kendall/i.test(n)).sort(cmpV)]];
  const gsum=ns=>ns.reduce((a,al)=>{const Sx=byAlias[al].all;a.n+=Sx.n;a.s+=Sx.pts.length;a.e+=Sx.err;a.m+=Sx.errMin;return a;},{n:0,s:0,e:0,m:0});
  const rowsH=groups.map(([g,ns])=>{const t=gsum(ns);return `<div class="grp" data-key="grp:${g}">${g}<small>Job ${ns.length}개 · 표본 ${t.s} / 배치 ${t.n}${t.e?" · Error "+t.e+"건 · Error 대기 "+hm(t.m):""}</small></div>`+(ns.map(rowH).join("")||`<p class="empty" data-key="empty:${g}">이 기간 ${g} Job 의 기록이 없습니다.</p>`);}).join("");
  const tot=gsum(names);
  const spans=S.segGroup([{k:7,label:"최근 7일"},{k:21,label:"최근 21일"},{k:0,label:"전체 "+D.days.length+"일"}],span,k=>setState({rptSpan:k}));
  const pct=lotAll?Math.round(lotIn/lotAll*100):0;
  const sortLabel=(COLS.find(c=>c[0]===SK)||COLS[0])[1]+(SD>0?" 오름차순":" 내림차순");
  return `<div class="bar-h"><h1>TB500 · Kendall</h1><span style="font-size:12.5px;color:#5A6673">Kendall ${groups[0][1].length}개 · TB500 ${groups[1][1].length}개 · ${esc(sortLabel)}</span><div class="spacer"></div>${segHtml(spans)}</div>
    <p style="margin:-6px 0 14px;font-size:12.5px;color:#5A6673;word-break:keep-all">이 탭은 TB500 · Kendall 을 위한 것입니다 — 표기명 ${Object.keys(JOB_ALIAS).length}개 Job 만 봅니다(이 기간 Lot ${lotAll}개 중 ${lotIn}개, ${pct}%). 나머지 Job 은 가동률·Error 탭에 있습니다. 열 머리를 누르면 그 열로 정렬합니다.</p>
    <section class="cards sm" style="margin-bottom:16px">${[{k:"Job",v:names.length+"개",s:"표기명이 있는 것만"},{k:"표본 배치",v:tot.s+"개",s:"배치 "+tot.n+"개 중 (Error·5장 미만 제외)"},{k:"Error",v:tot.e+"건",s:"Lot 단위"},{k:"Error 대기",v:hm(tot.m),s:"Error 구간 + 그 뒤 공백"}].map(s=>`<div><p class="k">${s.k}</p><p class="v num">${esc(s.v)}</p><p class="s">${esc(s.s)}</p></div>`).join("")}</section>
    <div class="panel" style="overflow-x:auto"><div style="min-width:980px" data-anim><div class="thead" style="grid-template-columns:${cols};gap:10px;align-items:end">${COLS.map(th).join("")}</div>
      ${rowsH}
      <p style="margin:0;padding:11px 18px;background:#FBFCFD;font-size:12px;color:#5A6673;border-top:1px solid #EDF1F5">배치시간 = 준비 + 장당 × 장수 로 1차 회귀 — 절편이 준비, 기울기가 장당, ± 는 회귀 표준오차. 환산은 최빈 장수 기준. 표본 5개 미만이면 내지 않음. 배치시간은 Report 의 배치 시작~종료. 평균 fault 는 Report 표 Faults 가 있는 행만(옛 캐시 행은 다시 읽어야 채워짐).</p></div></div>`;
}

/* ---------- boot ---------- */
loadDemo();
</script>
</body>
</html>
