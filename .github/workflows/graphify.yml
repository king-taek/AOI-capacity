# main 에 푸시할 때마다 graphify 코드 지도를 다시 만들어 `graphify-out` 브랜치(커밋 하나, 덮어씀)와
# 워크플로 산출물에 올린다. main 자체에는 아무것도 커밋하지 않는다 — 업데이터가 main 의 SHA 를 보고
# 사용자 PC 에 업데이트를 내려보내므로, 봇 커밋이 main 에 들어가면 헛 업데이트가 생긴다.
# 권한은 잡별 최소(S16): 분석 잡 `graph` 는 읽기만, `contents: write` 는 게시 잡 `publish` 한 곳뿐이다.
name: graphify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: graphify 설치
        run: pip install "graphifyy[sql]"

      - name: 코드 지도 생성 (AST 만 — API 키 없음)
        run: python dev/tools/graphify_build.py

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out-${{ github.sha }}
          path: |
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_TREE.html
            graphify-out/GRAPH_REPORT.md
          retention-days: 30

  publish:
    needs: graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 산출물 내려받기
        uses: actions/download-artifact@v4
        with:
          name: graphify-out-${{ github.sha }}
          path: graphify-out

      - name: graphify-out 브랜치에 게시 (커밋 하나로 덮어씀)
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          pub="$(mktemp -d)"
          cp graphify-out/graph.json graphify-out/graph.html graphify-out/GRAPH_TREE.html graphify-out/GRAPH_REPORT.md "$pub/"
          {
            echo "# AOI-capacity 코드 지도 (graphify)"
            echo
            echo "main \`${SHA}\` 기준으로 GitHub Actions 가 자동 생성. 사람이 고치지 않는다 — 다음 main 푸시 때 통째로 바뀐다."
            echo
            echo "- \`graph.html\` — 브라우저에서 여는 인터랙티브 그래프"
            echo "- \`GRAPH_TREE.html\` — 커뮤니티 트리"
            echo "- \`GRAPH_REPORT.md\` — 요약 보고서"
            echo "- \`graph.json\` — 로컬에서 질의: \`pip install graphifyy\` 뒤 이 폴더를 \`graphify-out/\` 으로 두고 \`graphify explain \"parse_report()\"\`"
          } > "$pub/README.md"
          cd "$pub"
          git init -q -b graphify-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "코드 지도 갱신 — main ${SHA}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" graphify-out:graphify-out
