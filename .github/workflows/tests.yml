# main 푸시 = 현장 배포(업데이터가 main 의 SHA 를 보고 내려보낸다)이므로 그 전에 전체 테스트를 돌린다.
# 이름 `tests` 는 계약이다 — 업데이터가 나중에 "이 워크플로가 그 커밋에서 성공했는가" 를 배포 조건으로 본다(계획 S02·AC05).
# - core   : Linux + Python 3.11 + Node 22 + Qt offscreen 으로 전체 스위트(slow 포함, pytest.ini 의 -q 그대로).
#            필수 의존성(yaml·PyQt6·node)이 없으면 사전 점검에서 실패한다 — 조용한 skip 으로 초록불이 되지 않게.
# - browser: Playwright Chromium 으로 `browser` 마커 테스트. 아직 그런 테스트가 없으면(pytest exit 5) 통과로 처리한다.
# 권한은 읽기만. 이 워크플로는 어디에도 푸시하지 않는다.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Qt offscreen 런타임 라이브러리 (PyQt6 import 에 필요)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: 의존성 설치 (런타임 + 개발)
        run: python -m pip install -r requirements.txt -r dev/requirements-dev.txt

      - name: 사전 점검 — 필수 의존성이 없으면 여기서 실패한다
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          python -c "import yaml, PyQt6"
          python -c "from PyQt6.QtWidgets import QApplication; QApplication([]); print('Qt offscreen ok')"
          node --version
          python -m pytest --version

      - name: 전체 테스트 (slow 포함)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --durations=15

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Qt offscreen 런타임 라이브러리 (수집 모듈 테스트가 PyQt6 를 import 한다)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: 의존성 설치 (런타임 + 개발)
        run: python -m pip install -r requirements.txt -r dev/requirements-dev.txt

      - name: Playwright Chromium 설치
        run: python -m playwright install --with-deps chromium

      - name: 사전 점검 — Playwright 가 실제로 import 되고 브라우저가 뜬다
        run: |
          set -eu
          python -c "import yaml, PyQt6, playwright"
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print("chromium", b.version)
              b.close()
          PY

      - name: browser 마커 테스트 (아직 없으면 exit 5 → 통과)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest -q -m browser --durations=15
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "browser 마커 테스트가 아직 없다(pytest exit 5) — 통과로 처리"
            exit 0
          fi
          exit "$rc"
