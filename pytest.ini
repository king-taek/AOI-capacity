[pytest]
testpaths = dev/tests
python_files = test_*.py
addopts = -q
markers =
    ui: Qt(QApplication) 를 쓰는 테스트 — conftest 가 자동으로 붙인다.
    slow: 실데이터 전수(30일치 샘플)를 읽는 테스트 — 빠른 확인에서는 -m "not slow" 로 뺀다.
    browser: Playwright Chromium 으로 결과 HTML 의 클릭 경로를 실측하는 테스트 — CI 의 browser 잡이 -m browser 로 따로 돈다.
